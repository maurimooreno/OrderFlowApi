name: orderflow

services:
  orderflow-api:
    build:
      context: .
      dockerfile: src/OrderFlow.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__OrderFlowDb: ${ORDERFLOW_DB_CONNECTION_STRING:?ORDERFLOW_DB_CONNECTION_STRING is required.}
      ServiceBus__Provider: AzureServiceBus
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__QueueName: order-operations
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      - servicebus-emulator
    networks:
      - orderflow-network

  orderflow-worker:
    build:
      context: .
      dockerfile: src/OrderFlow.Worker/Dockerfile
    environment:
      ConnectionStrings__OrderFlowDb: ${ORDERFLOW_DB_CONNECTION_STRING:?ORDERFLOW_DB_CONNECTION_STRING is required.}
      ServiceBus__Provider: AzureServiceBus
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__QueueName: order-operations
    depends_on:
      - servicebus-emulator
    networks:
      - orderflow-network

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
      - "5300:${EMULATOR_HTTP_PORT:-5300}"
    environment:
      SQL_SERVER: servicebus-sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required.}
      ACCEPT_EULA: ${ACCEPT_EULA:?ACCEPT_EULA is required.}
      EMULATOR_HTTP_PORT: ${EMULATOR_HTTP_PORT:-5300}
    depends_on:
      - servicebus-sqlserver
    networks:
      - orderflow-network

  servicebus-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?ACCEPT_EULA is required.}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required.}
    networks:
      - orderflow-network

networks:
  orderflow-network:
